<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Enterprise Vitrine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen custom-scrollbar">
  <div id="authSection" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="glass-card p-8 rounded-3xl max-w-md w-full space-y-6 border border-slate-800 text-center">
      <div class="w-12 h-12 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-xl font-bold">🔐</div>
      <h2 class="text-2xl font-black text-white">Espace Admin</h2>
      <p class="text-xs text-slate-400">Ampidiro ny teny miafina mba hidirana amin'ny fitantanana.</p>
      <input id="adminPass" type="password" placeholder="Mot de passe (Default: 1234)" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center text-white focus:outline-none focus:border-blue-500">
      <button onclick="loginAdmin()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs uppercase tracking-widest transition">Hidirana (Se connecter)</button>
    </div>
  </div>

  <div id="adminDashboard" class="hidden min-h-screen flex flex-col">
    <header class="glass-header h-20 px-8 flex items-center justify-between border-b border-slate-800">
      <div class="flex items-center gap-3">
        <span class="text-xl font-black text-gradient">Admin Panel</span>
        <span class="text-xs bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full font-bold border border-blue-500/30">Live CMS</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="index.html" target="_blank" class="text-xs text-slate-300 hover:text-white font-semibold">👁️ Hijery ny site</a>
        <button onclick="logoutAdmin()" class="px-4 py-2 bg-red-500/20 text-red-400 hover:bg-red-500/30 font-bold text-xs rounded-xl transition">Hivoaka</button>
      </div>
    </header>
    <main class="p-8 max-w-7xl mx-auto w-full space-y-8 flex-grow">
      <div class="glass-card p-6 rounded-3xl border border-slate-800 space-y-4">
        <h3 class="text-lg font-bold text-white">Paramètres Généraux du Site</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input id="admCompanyName" type="text" placeholder="Anaran'ny Orinasa" class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
          <input id="admPhone" type="text" placeholder="Laharana Telefonina" class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
          <input id="admEmail" type="text" placeholder="Email Contact" class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
          <input id="admAddress" type="text" placeholder="Adiresy Orinasa" class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
        </div>
        <textarea id="admHeroTitle" placeholder="Hero Title" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"></textarea>
        <button onclick="saveGeneralSettings()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition">Tehirizina (Sauvegarder)</button>
      </div>
      <div class="glass-card p-6 rounded-3xl border border-slate-800 space-y-4">
        <h3 class="text-lg font-bold text-white">Boîte de Réception / Messages Mpanjifa</h3>
        <div id="messagesContainer" class="space-y-3 text-xs text-slate-300">Miandry hafatra...</div>
      </div>
    </main>
  </div>
</body>
</html>
